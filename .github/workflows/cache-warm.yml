# main の Cargo 依存が変わったとき(と週1回)、リリースと同じ条件で
# ビルドして rust-cache を main に作る。タグ実行はそこから復元できる。
# (Actions のキャッシュは作ったタグの中でしか使えず、main のものだけ全体から使える)
name: Cache Warm

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/Cargo.toml'
  schedule:
    - cron: '0 3 * * 1' # 毎週月曜。7日間未使用でキャッシュが消えるのを防ぐ
  workflow_dispatch:

jobs:
  # ジョブ名は release.yml と同じにする(rust-cache のキーに入る)
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - run: bun install --frozen-lockfile

      # インストーラーの作成と署名は省く。リリースと同じ機能フラグで依存だけビルドする。
      - name: Build (no bundle)
        run: bun tauri build --no-bundle
